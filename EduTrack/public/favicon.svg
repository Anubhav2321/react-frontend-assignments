<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="60%" stop-color="#4338ca" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#4f46e5" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Shield/Rounded Card -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#brandGrad)" />
  <rect x="2" y="2" width="60" height="60" rx="16" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1.5" />

  <!-- Graduation Cap Top diamond -->
  <path d="M32 14L51 23.5L32 33L13 23.5L32 14Z" fill="url(#accentGrad)" filter="url(#glow)" />
  
  <!-- Under-cap skull base -->
  <path d="M21 28.5V36C21 40 26 43 32 43C38 43 43 40 43 36V28.5L32 34L21 28.5Z" fill="#c7d2fe" fill-opacity="0.9" />

  <!-- Tassel ribbon & bead -->
  <path d="M19 26.5V37C19 38 17.5 39 17.5 39" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="17.5" cy="40.5" r="2" fill="#f59e0b" />

  <!-- Attendance Badge / Checkmark disc -->
  <circle cx="45" cy="45" r="13" fill="#0f172a" />
  <circle cx="45" cy="45" r="11" fill="url(#checkGrad)" />
  <path d="M40.5 45L43.5 48L49.5 42" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>

