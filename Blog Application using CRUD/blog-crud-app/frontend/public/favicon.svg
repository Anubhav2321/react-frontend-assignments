<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2937" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    
    <!-- Pen Tip Gradient -->
    <linearGradient id="penGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Inner Glow/Shadow for Pen -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#8b5cf6" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="120" height="120" rx="32" fill="url(#bgGradient)" />

  <!-- Pen Graphic -->
  <g transform="translate(60, 60) rotate(45) translate(-60, -60)">
    <!-- Base of the pen nib -->
    <path d="M42,80 L78,80 L82,45 C82,30 60,12 60,12 C60,12 38,30 38,45 Z" fill="url(#penGradient)" filter="url(#dropShadow)" />
    <!-- Cutout / Line down the middle -->
    <path d="M60,35 L60,80" stroke="#030712" stroke-width="4" stroke-linecap="round" />
    <!-- Small hole in the nib -->
    <circle cx="60" cy="55" r="5" fill="#030712" />
  </g>
  
  <!-- Ink dots / sparkles -->
  <circle cx="30" cy="85" r="5" fill="#ec4899" />
  <circle cx="85" cy="90" r="7" fill="#3b82f6" />
  <circle cx="20" cy="40" r="3.5" fill="#8b5cf6" />
  <circle cx="95" cy="30" r="4" fill="#ec4899" />
</svg>