<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="100" height="100" rx="24" fill="url(#bg)" />
  
  <g fill="#ffffff" opacity="0.8">
    <rect x="12" y="15" width="10" height="12" rx="3" />
    <rect x="12" y="44" width="10" height="12" rx="3" />
    <rect x="12" y="73" width="10" height="12" rx="3" />
    
    <rect x="78" y="15" width="10" height="12" rx="3" />
    <rect x="78" y="44" width="10" height="12" rx="3" />
    <rect x="78" y="73" width="10" height="12" rx="3" />
  </g>
  
  <circle cx="50" cy="50" r="22" fill="rgba(255,255,255,0.25)" stroke="#ffffff" stroke-width="2.5" filter="url(#glow)"/>
  <polygon points="44,36 64,50 44,64" fill="#ffffff" stroke="#ffffff" stroke-width="1" stroke-linejoin="round"/>
</svg>